params:
  seed: 42
  env:
    clip_observations: 5.0
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.5
        fixed_sigma: true
    mlp:
      units:
      - 256
      - 256
      - 128
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: false
  load_path: ''
  config:
    name: ghand_baoding
    full_experiment_name: baseline
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.995
    tau: 0.95
    learning_rate: 0.0003
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 300
    save_best_after: 10
    save_frequency: 100
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001
    player:
      deterministic: true
      games_num: 100000
      print_stats: true
    train_dir: /home/jdzhang/ghand_projects/ghand_baoding/runs/logs/rl_games/ghand_baoding
